<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - Cambo Store</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body onload="loadPanel()"><div class="dash"><aside class="side"><div class="logo">CAMBO <span>STORE</span></div><a class="active" href="panel.html">Dashboard</a><a id="adminLink" href="admin.html" style="display:none">Admin Panel</a><a href="index.html">Home</a><a onclick="logout()">Logout</a></aside><main class="main"><div class="topbar"><div><h1>Dashboard</h1><p id="userEmail"></p></div><div><b id="userName"></b><p>Plan: <span id="planName"></span></p></div></div><section class="cards"><div class="panel-card"><h2>Pro Plan $5</h2><p id="proStatus">Checking...</p><p>Scan your owner QR/payment and upload proof.</p><input id="proProof" type="file" accept="image/*"><button onclick="requestPro()">Submit Pro Proof</button></div><div class="panel-card"><h2>Create Store</h2><label>Store Name</label><input id="siteTitle" placeholder="CAFFE MC"><label>Slug</label><input id="siteSlug" placeholder="caffemc"><label>Description</label><textarea id="siteDesc" placeholder="Best Minecraft server shop"></textarea><label>Template</label><select id="siteTemplate"><option value="neon">Neon Gaming</option><option value="emerald">Emerald</option><option value="purple">Purple</option></select><button onclick="createSite()">Create Website</button></div><div class="panel-card"><h2>Your Stores</h2><div id="sites"></div></div></section><section id="editor" class="builder"><div class="panel-card"><h2>Builder Studio</h2><label>Title</label><input id="eTitle"><label>Hero Title</label><input id="eHero"><label>Description</label><textarea id="eDesc"></textarea><label>Template</label><select id="eTemplate"><option value="neon">Neon Gaming</option><option value="emerald">Emerald</option><option value="purple">Purple</option></select><label>Background</label><input id="eBg" type="color"><label>Button</label><input id="eBtn" type="color"><label>Text</label><input id="eText" type="color"><label>Accent</label><input id="eAccent" type="color"><label>Logo</label><input id="logoFile" type="file" accept="image/*"><label>Banner</label><input id="bannerFile" type="file" accept="image/*"><label>Payment QR</label><input id="qrFile" type="file" accept="image/*"><h3>Notifications</h3><label>Type</label><select id="notifyType"><option value="off">Off</option><option value="discord">Discord</option><option value="telegram">Telegram</option><option value="both">Both</option></select><label>Discord Webhook</label><input id="discordWebhook"><label>Telegram Chat ID</label><input id="telegramChat"><button onclick="saveSite()">Save Store</button><a id="openPublic" class="btn ghost" target="_blank">Open Store</a></div><div class="panel-card"><h2>Live Preview</h2><div id="livePreview"></div><h2>Add Item</h2><label>Name</label><input id="itemName"><label>Price</label><input id="itemPrice" type="number" step="0.01"><label>Description</label><textarea id="itemDesc"></textarea><label>Button Text</label><input id="itemButton" value="Add"><label>Image</label><input id="itemImage" type="file" accept="image/*"><button onclick="addItem()">Add Item</button><div id="items"></div></div></section></main></div><div id="toastBox"></div></body></html>
