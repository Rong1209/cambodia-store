<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - Cambo Store</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body onload="loadPanel()"><aside class="dash-side"><div class="logo"><img src="img/logo.png"><span>CAMBO<br><b>STORE</b></span></div><a class="active">Dashboard</a><a id="adminLink" style="display:none" onclick="go('admin.html')">Admin Panel</a><a onclick="go('index.html')">Home</a><a onclick="logout()">Logout</a></aside><main class="dash"><header><div><h1>Hello, <span id="userName">...</span></h1><p id="userEmail"></p></div><span id="planName" class="badge hot">FREE</span></header><section class="dash-grid"><div id="proBox" class="panel pro"><h2>Pro Plan $5</h2><div id="proState"><b>Free Plan</b><span>Upload proof and admin will approve Pro.</span></div><img class="qr" src="img/qr.png"><input id="proProof" type="file" accept="image/*"><button onclick="requestPro()">Submit Pro Proof</button></div><div class="panel"><h2>Create Store</h2><input id="siteTitle" placeholder="Store name"><input id="siteSlug" placeholder="URL slug e.g. caffemc"><select id="siteTemplate"><option value="neon">Neon Minecraft</option><option value="emerald">Emerald</option><option value="royal">Royal Purple</option></select><textarea id="siteDesc" placeholder="Description"></textarea><button onclick="createSite()">Create Website</button></div></section><section class="panel"><h2>Your Websites</h2><div id="sites"></div></section><section class="panel"><div class="section-head"><h2>Pending Transactions</h2><button class="ghost" onclick="loadOwnerOrders()">Refresh</button></div><div id="ownerOrders"></div></section><section id="editor" class="panel editor"><h2>Builder Studio</h2><div class="builder-grid"><div><label>Template</label><select id="eTemplate"><option value="neon">Neon</option><option value="emerald">Emerald</option><option value="royal">Royal</option></select><input id="eTitle" placeholder="Title"><input id="eHero" placeholder="Hero name"><textarea id="eDesc" placeholder="Description"></textarea><div class="colors"><input id="eBg" type="color"><input id="eBtn" type="color"><input id="eText" type="color"><input id="eAccent" type="color"></div><label>Logo</label><input id="logoFile" type="file"><label>Banner</label><input id="bannerFile" type="file"><label>QR Code</label><input id="qrFile" type="file"><h3>Notification Center</h3><select id="notifyType"><option value="off">Off</option><option value="discord">Discord</option><option value="telegram">Telegram</option><option value="both">Both</option></select><input id="discordWebhook" placeholder="Discord webhook"><input id="telegramChat" placeholder="Telegram chat ID"><button onclick="saveSite()">Save Store</button><a id="openPublic" target="_blank">Open Public Site</a></div><div><div id="livePreview" class="live-preview"></div><h3>Add Item</h3><input id="itemName" placeholder="Item name"><input id="itemPrice" placeholder="Price"><select id="itemCat"><option>Ranks</option><option>Keys</option><option>Kits</option><option>Crates</option></select><textarea id="itemDesc" placeholder="Description"></textarea><input id="itemButton" placeholder="Button text" value="Add"><input id="itemImage" type="file"><button onclick="addItem()">Add Item</button><div id="items"></div></div></div></section></main><div id="toastBox"></div></body></html>
