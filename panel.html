<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body class="dash-page" onload="loadPanel()"><div class="panel-wrap"><h1>Dashboard</h1><p><b id="userName"></b> · <span id="userEmail"></span> · <span id="planName"></span> <a id="adminLink" style="display:none" href="admin.html">Admin</a> <button onclick="logout()">Logout</button></p><div id="verifyNotice" class="notice">Verify Gmail before buying Pro or creating sites. <a href="verify.html">Verify now</a></div><div class="panel-grid"><div class="panel-card"><h2>Buy Pro $5</h2><p>Scan your QR, upload proof, admin approves.</p><input id="proProof" type="file" accept="image/*"><button id="upgradeBtn" onclick="requestPro()">Submit Pro Proof</button></div><div class="panel-card"><h2>Create Website</h2><input id="siteTitle" placeholder="Store name"><input id="siteSlug" placeholder="slug"><select id="siteTemplate"><option value="neon">Neon</option></select><input id="siteDesc" placeholder="Description"><button onclick="createSite()">Create</button></div></div><h2>Your Sites</h2><div id="sites"></div><div id="editor" style="display:none" class="panel-card"><h2>Builder Studio</h2><a id="openPublic" target="_blank">Open public site</a><input id="eTitle" placeholder="Title"><input id="eHero" placeholder="Hero text"><textarea id="eDesc" placeholder="Description"></textarea><select id="eTemplate"><option value="neon">Neon</option></select><label>Background</label><input id="eBg" type="color"><label>Button</label><input id="eBtn" type="color"><label>Text</label><input id="eText" type="color"><label>Accent</label><input id="eAccent" type="color"><label>Logo</label><input id="logoFile" type="file"><label>Banner</label><input id="bannerFile" type="file"><label>Payment QR</label><input id="qrFile" type="file"><select id="notifyType"><option value="off">Off</optio
